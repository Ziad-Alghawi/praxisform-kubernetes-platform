# Local demo stack: docker compose up
# The fallback values below are fake and for local use only (see .env.example).

services:
  mongodb:
    image: mongo:7.0.28
    container_name: praxis-mongodb
    ports:
      - "127.0.0.1:27017:27017" # no auth, so keep it off the network
    environment:
      MONGO_INITDB_DATABASE: praxis
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "mongodb://localhost:27017/praxis",
          "--eval",
          "db.runCommand({ ping: 1 }).ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  seed:
    image: mongo:7.0.28
    container_name: praxis-seed
    command: ["mongosh", "--quiet", "mongodb://mongodb:27017/praxis", "/seed/demo-seed.js"]
    volumes:
      - ./scripts/seed:/seed:ro
    depends_on:
      mongodb:
        condition: service_healthy

  backend:
    build:
      context: ./praxis
      dockerfile: Dockerfile
    container_name: praxis-backend
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/praxis
      JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-not-for-production-use}
      JWT_EXP_MINUTES: ${JWT_EXP_MINUTES:-120}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-demo-only-not-a-real-password}
    depends_on:
      mongodb:
        condition: service_healthy

  frontend:
    build:
      context: ./praxis-frontend
      dockerfile: Dockerfile
    container_name: praxis-frontend
    ports:
      - "4200:80"
    environment:
      API_URL: "http://localhost:8080"
    depends_on:
      - backend

volumes:
  mongo_data:
