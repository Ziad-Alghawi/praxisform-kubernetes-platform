apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ziad-praxis-form-tls
  namespace: workshop-ziad
spec:
  secretName: ziad-praxis-form-tls
  dnsNames:
    - ziad.praxis-form.de
  issuerRef:
    group: cert-manager.io
    kind: ClusterIssuer
    name: praxis-form-letsencrypt-prod
  usages:
    - digital signature
    - key encipherment
