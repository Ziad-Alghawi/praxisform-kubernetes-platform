backend:
  replicas: 2
  image:
    repo: ghcr.io/ziad-alghawi/praxis-backend
    tag: v1
imagePullSecrets:
  name: regcred

frontend:
  replicas: 2
  apiUrl: https://ziad.praxis-form.de
  image:
    repo: ghcr.io/ziad-alghawi/frontend
    tag: v1
    
imagePullSecrets:
  name: regcred

certificate:
  name: ziad-praxis-form-tls
  secretName: ziad-praxis-form-tls
  dnsName: ziad.praxis-form.de

grafana:
  enabled: true
  ingress:
    enabled: true
    ingressClassName: nginx
    # Values can be templated
    annotations: 
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    path: /
    pathType: Prefix

    hosts:
      - grafana-ziad.praxis-form.de
    
    tls:
      - secretName: grafana-praxis-form-tls
        hosts:
          - grafana-ziad.praxis-form.de