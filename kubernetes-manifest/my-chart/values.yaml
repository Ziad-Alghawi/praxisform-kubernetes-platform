backend:
  replicas: 2
  image:
    # The images CI pushes to GHCR, tagged with the commit they were built from
    repo: ghcr.io/ziad-alghawi/praxisform-kubernetes-platform/backend
    tag: 910aa4c155d98a9f74c45fc6fc2bc3a61fc092c0
imagePullSecrets:
  name: regcred

frontend:
  replicas: 2
  apiUrl: https://ziad.praxis-form.de
  image:
    repo: ghcr.io/ziad-alghawi/praxisform-kubernetes-platform/frontend
    tag: 910aa4c155d98a9f74c45fc6fc2bc3a61fc092c0
    
imagePullSecrets:
  name: regcred

certificate:
  name: ziad-praxis-form-tls
  secretName: ziad-praxis-form-tls
  dnsName: ziad.praxis-form.de

grafana:
  enabled: false
  ingress:
    enabled: true
    ingressClassName: nginx
    # Values can be templated
    annotations: 
      nginx.ingress.kubernetes.io/ssl-redirect: "false"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "false"
    path: /
    pathType: Prefix

    hosts:
      - grafana-ziad.praxis-form.de
    
    tls:
      - secretName: grafana-praxis-form-tls
        hosts:
          - grafana-ziad.praxis-form.de