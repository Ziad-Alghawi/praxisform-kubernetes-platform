# Monthly version updates, grouped into one pull request per package ecosystem. Major versions
# are left out because they need a code change; security fixes show up as Dependabot alerts.
version: 2
updates:
  - package-ecosystem: npm
    directory: /praxis-frontend
    schedule:
      interval: monthly
    groups:
      npm-praxis-frontend:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: maven
    directory: /praxis
    schedule:
      interval: monthly
    groups:
      maven-praxis:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore(deps)
