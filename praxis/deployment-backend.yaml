apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: workshop-ziad
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: backend
          image: ghcr.io/ziad-alghawi/praxis-backend:v1
          imagePullPolicy: Always
          env:
            - name: MONGODB_URI
              value: mongodb://praxis-form-mongodb.praxis.svc.cluster.local:27017/praxis-ziad
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
            - name: JWT_EXP_MINUTES
              value: "120"
            - name: ADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: ADMIN_DEFAULT_PASSWORD
          ports:
            - containerPort: 8080
