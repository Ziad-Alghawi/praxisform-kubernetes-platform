app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration-minutes: ${JWT_EXP_MINUTES:120}
  admin:
    default-password: ${ADMIN_DEFAULT_PASSWORD:}

spring:
  mongodb:
    uri: ${MONGODB_URI:mongodb://localhost:27017/praxis}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

