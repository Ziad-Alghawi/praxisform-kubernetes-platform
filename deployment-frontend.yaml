apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: workshop-ziad
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: regcred
      containers:
        - name: frontend
          image: ghcr.io/ziad-alghawi/frontend:v1
          imagePullPolicy: Always
          env:
            - name: BACKEND_URL
              value: "http://backend-service:8080"
          ports:
            - containerPort: 80
