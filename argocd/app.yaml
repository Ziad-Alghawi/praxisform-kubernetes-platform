apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ziad-praxis-form
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "git@github.com:Ziad-Alghawi/kubernetes-devops-platform.git"
    targetRevision: main
    path: kubernetes-manifest/my-chart
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: workshop-ziad
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
